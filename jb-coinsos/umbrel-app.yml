manifestVersion: 1
id: jb-coinsos
category: bitcoin
name: CoinsOS
icon: https://raw.githubusercontent.com/Silver765/Home-VPS/main/jb-coinsos/icon.svg
version: "1.0.0"
tagline: HiveOS-style mining fleet manager - dashboard, backend and OS image downloads
description: >-
  Self-hosted fleet manager for mining rigs: a web dashboard, the backend that
  rigs report to, and its database. Build the CoinsOS rig image on a Linux PC,
  drop the .img.xz and its .sha256 into this app's "releases" folder, and it
  appears on the dashboard's Downloads page.


  Rigs on your LAN connect straight to the backend (port 8080, plus UDP 9999
  for discovery). The dashboard (port 3020) can also be published on a domain
  through the Home VPS app's Caddy - see the Home VPS README. Downloads are not
  exposed on that public route.
