version: "3.7"

# 5tratumOS runs no app_proxy (see the TripleX app), so the dashboard publishes
# the manifest's `port:` (3010) directly. It is protected by its own login,
# whose password (default: admin) is also the SSH password; change it in Settings.
#
# Images are pinned by digest. The dashboard image is built by
# ../.github/workflows/publish-image.yml - after changing app/, bump the version
# in app/package.json and update the digest here.

services:
  app:
    image: ghcr.io/silver765/home-vps-app:1.2.2@sha256:e69d3fb8d3126d61fe2be84129f3d73df7ff8c8ec11b35fce837be2a17051c69
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      SSH_HOST: vps
      SSH_PORT: 2222
      SSH_USER: vps
      WEB_HOST: web
      PUBLIC_SSH_PORT: "2222"
      PUBLIC_WEB_PORT: "8088"
    volumes:
      - ${APP_DATA_DIR}/data/sites:/data/sites
      - ${APP_DATA_DIR}/data/vps-home:/data/vps-home
      - ${APP_DATA_DIR}/data/caddy:/data/caddy
      - ${APP_DATA_DIR}/data/auth:/data/auth

  # The "VPS": an SSH shell with sudo. `sudo apk add nodejs python3 git ...`
  vps:
    image: lscr.io/linuxserver/openssh-server:9.7_p1-r4-ls172@sha256:a40b2dc8d0bc72e49355fbdf695ccf0ad18f268e7543c53f7f5ac83ee2fcc10b
    hostname: homevps
    depends_on:
      - app # the dashboard creates the shared password file on first start
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SUDO_ACCESS=true
      - PASSWORD_ACCESS=true
      - USER_NAME=vps
      - FILE__USER_PASSWORD=/auth/password # default 'admin'; change it in the dashboard (Settings)
    ports:
      - "2222:2222"
      # For hosting CoinsOS in the shell (see coinsos-kit/): rig traffic + discovery
      - "8080:8080"
      - "9999:9999/udp"
    volumes:
      - ${APP_DATA_DIR}/data/vps-home:/config
      - ${APP_DATA_DIR}/data/sites:/sites
      - ${APP_DATA_DIR}/data/auth:/auth:ro
      # Start-on-boot hooks you drop in ~/init.d and ~/services.d (coinsos-kit uses these)
      - ${APP_DATA_DIR}/data/vps-home/init.d:/custom-cont-init.d:ro
      - ${APP_DATA_DIR}/data/vps-home/services.d:/custom-services.d:ro

  # Public web server for your sites (HTTP on 8088). Reloads when the
  # Caddyfile is saved in the dashboard.
  web:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach other apps on this box, e.g. reverse_proxy host.docker.internal:3020
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    ports:
      - "8088:80"
      - "8089:81" # optional second site, e.g. CoinsOS dashboard on the LAN
    volumes:
      - ${APP_DATA_DIR}/data/sites:/srv
      - ${APP_DATA_DIR}/data/caddy:/etc/caddy
      - ${APP_DATA_DIR}/data/caddy-data:/data
