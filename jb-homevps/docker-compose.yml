version: "3.7"

services:
  # 5tratumOS runs no app_proxy, so the file manager publishes the manifest's
  # `port:` (8081) directly.
  # Web file manager (Umbrel UI). Manages the whole /srv tree: sites + vps home.
  files:
    image: filebrowser/filebrowser:v2.31.2
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8081:8080"
    command: ["--root", "/srv", "--database", "/db/filebrowser.db", "--port", "8080", "--address", "0.0.0.0"]
    volumes:
      - ${APP_DATA_DIR}/data/sites:/srv/sites
      - ${APP_DATA_DIR}/data/vps-home:/srv/vps-home
      - ${APP_DATA_DIR}/data/fb-db:/db

  # The "VPS": SSH shell with sudo. `sudo apk add nodejs python3 git ...`
  vps:
    image: lscr.io/linuxserver/openssh-server:9.7_p1-r4-ls172
    hostname: homevps
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SUDO_ACCESS=true
      - PASSWORD_ACCESS=true
      - USER_NAME=vps
      - USER_PASSWORD=${APP_PASSWORD}
    ports:
      - "2222:2222"
    volumes:
      - ${APP_DATA_DIR}/data/vps-config:/config
      - ${APP_DATA_DIR}/data/vps-home:/home/vps
      - ${APP_DATA_DIR}/data/sites:/sites

  # Public web server for your sites (HTTP on 8088)
  web:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ${APP_DATA_DIR}/data/sites:/srv
      - ${APP_DATA_DIR}/data/Caddyfile:/etc/caddy/Caddyfile
      - ${APP_DATA_DIR}/data/caddy-data:/data
