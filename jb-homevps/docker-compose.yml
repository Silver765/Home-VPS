version: "3.7"

# 5tratumOS runs no app_proxy (see the TripleX app), so the dashboard publishes
# the manifest's `port:` (3010) directly. It is protected by its own login,
# which uses this app's generated ${APP_PASSWORD} (same as the SSH password).
#
# Pin every image to @sha256:<digest> once published
# (see ../.github/workflows/publish-image.yml).

services:
  app:
    image: ghcr.io/silver765/home-vps-app:1.1.0
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      SSH_HOST: vps
      SSH_PORT: 2222
      SSH_USER: vps
      WEB_HOST: web
      PUBLIC_SSH_PORT: "2222"
      PUBLIC_WEB_PORT: "8088"
    volumes:
      - ${APP_DATA_DIR}/data/sites:/data/sites
      - ${APP_DATA_DIR}/data/vps-home:/data/vps-home
      - ${APP_DATA_DIR}/data/caddy:/data/caddy

  # The "VPS": an SSH shell with sudo. `sudo apk add nodejs python3 git ...`
  vps:
    image: lscr.io/linuxserver/openssh-server:9.7_p1-r4-ls172
    hostname: homevps
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SUDO_ACCESS=true
      - PASSWORD_ACCESS=true
      - USER_NAME=vps
      - USER_PASSWORD=${APP_PASSWORD}
    ports:
      - "2222:2222"
    volumes:
      - ${APP_DATA_DIR}/data/vps-home:/config
      - ${APP_DATA_DIR}/data/sites:/sites

  # Public web server for your sites (HTTP on 8088). Reloads when the
  # Caddyfile is saved in the dashboard.
  web:
    image: caddy:2.8-alpine
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    ports:
      - "8088:80"
    volumes:
      - ${APP_DATA_DIR}/data/sites:/srv
      - ${APP_DATA_DIR}/data/caddy:/etc/caddy
      - ${APP_DATA_DIR}/data/caddy-data:/data
