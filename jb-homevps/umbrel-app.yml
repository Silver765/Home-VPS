manifestVersion: 1
id: jb-homevps
category: developer
name: Home VPS
icon: https://raw.githubusercontent.com/Silver765/Home-VPS/main/jb-homevps/icon.svg
version: "1.2.2"
tagline: Your own VPS at home - dashboard, SSH terminal, web hosting
description: >-
  Turns your Umbrel or 5tratumOS box into a personal VPS. A dashboard shows
  how to connect and live CPU/RAM/disk, with a web terminal, a file manager
  and a Caddyfile editor. Under the hood: an SSH shell (Alpine Linux with sudo,
  port 2222) and a Caddy web server (port 8088) that serves your sites folder
  and can reverse-proxy your other services.


  Sign in to the dashboard (port 3010) with the default password "admin" (also the
  SSH password for user "vps") and change it in Settings. To expose sites to the internet use a
  Cloudflare Tunnel or forward 8088; avoid exposing SSH with a weak password.
developer: Silver765
website: https://github.com/Silver765/Home-VPS
dependencies: []
repo: https://github.com/Silver765/Home-VPS
support: https://github.com/Silver765/Home-VPS/issues
port: 3010
gallery: []
path: ""
defaultUsername: ""
defaultPassword: "admin"
releaseNotes: >-
  v1.2.2: Works when the OS serves the app under a sub-path (/apps/jb-homevps/); fixes the login doing nothing.
  v1.2.0: Default password is now admin (dashboard + SSH), changeable in Settings. No longer depends on the platform providing a password.
  v1.1.1: Ports 8080, 9999/udp, 8089 and boot hooks so you can host your own services (e.g. CoinsOS) in the shell.
  v1.1.0: New dashboard with web terminal, file manager, live stats and Caddyfile editor.
submitter: Silver765
submission: https://github.com/Silver765/Home-VPS
