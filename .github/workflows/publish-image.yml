name: Publish dashboard image

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/publish-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=$(jq -r .version app/package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/silver765/home-vps-app:${{ steps.v.outputs.version }}
            ghcr.io/silver765/home-vps-app:latest
